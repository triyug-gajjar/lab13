
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>

    <h1>STUDENT REG FORM</h1>

    <form id="studentForm" onsubmit="return validateMyform()">

        Enrollment Number:
        <br>
        <input type="text" id="enrollment">
        <br><br>

        Name:
        <br>
        <input type="text" id="name">
        <br><br>

        Email ID:
        <br>
        <input type="email" id="email">
        <br><br>

        Password:
        <br>
        <input type="password" id="password">
        <br><br>

        Confirm Password:
        <br>
        <input type="password" id="confirmPassword">
        <br><br>

        Phone Number:
        <br>
        <input type="text" id="phone">
        <br><br>

        Address:
        <br>
        <textarea id="address" rows="3" cols="30"></textarea>
        <br><br>

        Gender:
        <br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

        Branch:
        <br>
        <select id="branch">
            <option value="">--Select Branch--</option>
            <option value="Computer Engineering">Computer Engineering</option>
            <option value="IT Engineering">IT Engineering</option>
            <option value="Electronics">Electronics</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Civil">Civil</option>
        </select>
        <br><br>

        <input type="submit" value="Submit">

    </form>

    <script>
        function validateMyform() {

            let enrollment = document.getElementById("enrollment").value.trim();
            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirmPassword").value;
            let phone = document.getElementById("phone").value.trim();
            let address = document.getElementById("address").value.trim();
            let gender = document.querySelector('input[name="gender"]:checked');
            let branch = document.getElementById("branch").value;

            // Check empty fields
            if (
                enrollment === "" ||
                name === "" ||
                email === "" ||
                password === "" ||
                confirmPassword === "" ||
                phone === "" ||
                address === "" ||
                !gender ||
                branch === ""
            ) {
                alert("Please fill out all details");
                return false;
            }

            // Enrollment number validation
            let enrollmentpattern = /^[0-9]{10}$/;

            if (!enrollmentpattern.test(enrollment)) {
                alert("Invalid enrollment number. Enter exactly 10 digits.");
                return false;
            }

            // Name validation
            let namepattern = /^[A-Za-z ]+$/;

            if (!namepattern.test(name)) {
                alert("Name should contain only alphabets and spaces.");
                return false;
            }

            // Email validation
            let emailpattern =
                /^[a-z]+\.[a-z]+[0-9]{6}@marwadiuniversity\.ac\.in$/;

            if (!emailpattern.test(email)) {
                alert("Invalid email address. Enter a valid university email.");
                return false;
            }

            // Password validation
            let passwordpattern =
                /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{6,}$/;

            if (!passwordpattern.test(password)) {
                alert("Password must contain uppercase, lowercase and a number, with at least 6 characters.");
                return false;
            }

            // Confirm password validation
            if (password !== confirmPassword) {
                alert("Password and confirm password do not match.");
                return false;
            }

            // Phone number validation
            let phonepattern = /^[0-9]{10}$/;

            if (!phonepattern.test(phone)) {
                alert("Invalid phone number. Enter exactly 10 digits.");
                return false;
            }

            // Successful submission
            alert("Form Submitted Successfully!");
            return true;
        }
    </script>

</body>
</html>
